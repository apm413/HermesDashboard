<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' http://127.0.0.1:5557 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5557 ws://127.0.0.1:5557;" />
  <title>Hermes Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 28 28" width="22" height="22" class="gear">
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="14" cy="14" r="4" />
            <circle cx="14" cy="14" r="10" />
            <g stroke-linecap="round">
              <line x1="14" y1="2"  x2="14" y2="5"  />
              <line x1="14" y1="23" x2="14" y2="26" />
              <line x1="2"  y1="14" x2="5"  y2="14" />
              <line x1="23" y1="14" x2="26" y2="14" />
              <line x1="5"  y1="5"  x2="7"  y2="7"  />
              <line x1="21" y1="21" x2="23" y2="23" />
              <line x1="5"  y1="23" x2="7"  y2="21" />
              <line x1="21" y1="7"  x2="23" y2="5"  />
            </g>
          </g>
        </svg>
        <span class="title">Hermes Dashboard</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btn-reload" title="Перезагрузить дашборд">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
            <path d="M3 21v-5h5" />
          </svg>
        </button>
        <span class="status" id="backend-status">●</span>
        <span class="version" id="version">v2.0</span>
      </div>
    </header>

    <div class="layout">
      <section class="panel dashboard-panel">
        <iframe class="dashboard-iframe" src="http://127.0.0.1:5557/" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
      </section>

      <div class="resizer" id="resizer"></div>

      <section class="panel chat-panel">
        <header class="chat-header">
          <h2>Чат с агентами</h2>
          <div class="model-picker" id="model-picker" title="Выбрать AI-модель">
            <span class="model-status" id="model-status" title="Статус провайдеров">○</span>
            <select id="model-select" class="model-select" title="AI-модель"></select>
          </div>
          <button class="ghost-btn" id="btn-help" title="Список команд">/help</button>
        </header>
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-suggest" id="chat-suggest"></div>
        <form class="chat-input" id="chat-form">
          <input type="text" id="chat-text" placeholder="Введите команду (/tier1:seo) или текст…" autocomplete="off" spellcheck="false" />
          <button type="submit" class="send-btn" title="Отправить (Enter)">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
            </svg>
          </button>
        </form>
        <footer class="chat-foot">
          <span id="chat-status">⌨</span>
          <span class="hint">Enter — отправить · ↑↓ — история · Tab — автокомплит</span>
        </footer>
      </section>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
