<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Dashboard — Steampunk Neomechanicum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <!-- Standalone: подгружаем React UMD + Babel для JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script>
    // SDK-shim для standalone (подменяем window.__HERMES_PLUGIN_SDK__ реальным React)
    window.__HERMES_PLUGIN_SDK__ = {
      React: window.React,
      hooks: window.React,
      components: {},
      fetchJSON(path, opts) {
        return fetch(path, opts).then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
      },
    };

    window.__HERMES_PLUGINS__ = window.__HERMES_PLUGINS__ || {
      _list: [],
      register(name, Component) {
        this._list.push({ name, Component });
        const last = this._list[this._list.length - 1];
        const root = document.getElementById('root');
        if (last && root) {
          const el = window.React.createElement(last.Component);
          window.ReactDOM.createRoot(root).render(el);
        }
      },
    };
  </script>
  <script src="index.js"></script>
</body>
</html>
